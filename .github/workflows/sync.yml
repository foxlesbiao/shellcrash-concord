name: sync-concord

# 从 user-7392/nikki-concord 的 release 里提取静态链接的 aarch64 concord 内核，
# 重新发布成本仓库的 release，供 ShellCrash 直接使用。
#
# 为什么是提取而不是自己编译：
#   - nikki-concord 已经做了 OpenWrt/LuCI 适配（低内存 jemalloc 调优、release_free_memory、
#     测速并发限流、Mihomo 未知字段兼容等），自己从上游 concord 编出来没有这些补丁
#   - 免去 BoringSSL + LTO 的 30-60 分钟编译和 OOM 风险
#   - 上游发版快，本 workflow 每日跟随

on:
  schedule:
    - cron: "0 4 * * *"   # 每日 04:00 UTC（concord 上游发版很快，周更会落后）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 上游所有 release 都是 prerelease，/releases/latest 会 404，必须用列表。
          # 跳过带 lgbm 的变体（那是另一套版本号与配置）。
          gh api "repos/user-7392/nikki-concord/releases?per_page=20" > rel.json
          python3 - <<'PY' > resolved.txt
          import json, sys
          releases = json.load(open("rel.json"))
          for r in releases:
              if "lgbm" in r["tag_name"]:
                  continue
              # 只用非 lgbm 的最新一版；架构从 ipk 文件名里取 (.._<arch>.ipk)
              ips = {}
              for a in r["assets"]:
                  n = a["name"]
                  if n.endswith(".ipk") and "_" in n:
                      arch = n[:-4].split("_", 1)[1]
                      ips[arch] = a["browser_download_url"]
              if not ips:
                  continue
              print(r["tag_name"])
              for arch, url in sorted(ips.items()):
                  print(f"{arch} {url}")
              sys.exit(0)
          sys.exit("no usable release")
          PY
          TAG=$(head -1 resolved.txt)
          echo "resolved $TAG"
          tail -n +2 resolved.txt | tee archs.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "archs<<EOF"
            cat archs.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download and extract all architectures
        env:
          ARCHS: ${{ steps.upstream.outputs.archs }}
        run: |
          set -euo pipefail
          echo "$ARCHS" | while read -r arch url; do
            [ -n "$arch" ] || continue
            echo "=== $arch ==="
            rm -rf x nikki.ipk
            curl -fsSL --retry 3 -o nikki.ipk "$url"
            mkdir -p x
            tar xzf nikki.ipk -C x
            tar xzf x/data.tar.gz -C x
            core=$(find x -type f -name concord | head -1)
            test -n "$core" || { echo "concord not found for $arch"; find x -type f | head -20; exit 1; }

            # 只需静态链接：nilkkic 各架构产物都是 musl static
            file "$core"
            file "$core" | grep -q 'statically linked' || { echo "$arch not static"; exit 1; }

            case "$arch" in
              aarch64*) file "$core" | grep -q 'ARM aarch64' || { echo "$arch not aarch64"; exit 1; } ;;
              x86_64)   file "$core" | grep -q 'x86-64'      || { echo "$arch not x86_64"; exit 1; } ;;
            esac

            # -n：不写原始文件名/时间戳。nikki 包里的 mtime 是 1970+，gzip 会报
            # "file timestamp out of range" 并以 2 退出，配合 pipefail 直接中断 CI。
            gzip -9n -c "$core" > "concord-$arch.gz"
            sha256sum "concord-$arch.gz" > "concord-$arch.gz.sha256"
            ls -lh "concord-$arch.gz"
          done
          echo "--- 产物 ---"
          ls -1 concord-*.gz

      - name: Package ShellCrash scripts
        run: |
          set -euo pipefail
          # 以上游 tar.gz 为底（含 .list/init.sh/lang 等），把本仓库改过的 scripts 盖上去。
          # 这样 release 里的 ShellCrash.tar.gz 就是 concord 专用版，可直接被"更新管理脚本"使用。
          curl -fsSL --retry 3 -o base.tar.gz \
            https://testingcf.jsdelivr.net/gh/juewuy/ShellCrash@master/ShellCrash.tar.gz
          mkdir -p pack
          tar -xzf base.tar.gz -C pack
          cp -rf ShellCrash/scripts/* pack/
          # 上游包里带着 sing-box 的脚本，cp 只覆盖不删除，它们会一路留进 release。
          # 本 fork 只跑 concord，在打包时删干净——而不是让每个安装的人再去删一遍。
          rm -f pack/starts/singbox_modify.sh \
                pack/starts/singbox_config_check.sh \
                pack/starts/singbox_check.sh \
                pack/menus/providers_singbox.sh \
                pack/libs/meta_listeners.sh \
                pack/starts/core_exchange.sh \
                pack/singbox_providers.list
          # 1.0.0 是本 fork 自己的版本号，不再沿用上游的 1.9.x。
          # 代码基线来自上游 master（当前是 v1.9.5beta4）。别急着跟进上游的
          # 1.9.6alpha1：它会生成非法的 tun stack: mips，路由器直接起不来。
          echo "1.0.0" > pack/version
          # 内核版本单独一个 asset：ShellCrash 的 version 是本体的版本号，
          # 路由器要判断"内核有没有更新"只能看这个。用上游 tag + commit，无可比性歧义。
          printf '%s\n' "${{ steps.upstream.outputs.tag }}" > core-version
          ( cd pack && tar -czf ../ShellCrash.tar.gz * )
          cp pack/version version
          # ---------- zashboard 面板 ----------
          # 上游给的那个 tar.gz 是某天的快照，从此不再更新。路由器没有 unzip
          # （BusyBox 只有 gunzip/bunzip2），官方的 dist-*.zip 解不开，所以在这里
          # 转成 tar.gz 一起发。取不到就沿用仓库里那份，不让发版失败。
          curl -fsSL --retry 2 --max-time 90 -o zb.zip \
            "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip" || true
          if [ -s zb.zip ] && unzip -tq zb.zip >/dev/null 2>&1; then
              rm -rf zbtmp && mkdir zbtmp
              unzip -q zb.zip -d zbtmp
              # zip 里可能包一层目录，找到真正的 index.html 所在
              ZBROOT=$(dirname "$(find zbtmp -name index.html -maxdepth 2 | head -1)")
              ( cd "$ZBROOT" && tar -czf ../../zashboard.tar.gz * )
              echo "zashboard repacked: $(stat -c %s zashboard.tar.gz) bytes"
          else
              echo "zashboard download failed, falling back to the repo copy"
              cp ShellCrash/bin/dashboard/zashboard.tar.gz zashboard.tar.gz
          fi
          ls -lh zashboard.tar.gz
          sha256sum ShellCrash.tar.gz > ShellCrash.tar.gz.sha256
          ls -lh ShellCrash.tar.gz
          echo "--- 校验补丁已在包内 ---"
          # grep -q 命中就关管道，tar 会报 Broken pipe；配合 pipefail 会把成功判成失败。
          # 先抽到文件再比，避免这个竞态。
          tar -xzOf ShellCrash.tar.gz menus/9_upgrade.sh > /tmp/chk9.sh 2>/dev/null
          grep -q "更新 Concord 内核" /tmp/chk9.sh || { echo "patch missing in package"; exit 1; }
          tar -xzOf ShellCrash.tar.gz libs/web_get_bin.sh > /tmp/chkw.sh 2>/dev/null
          grep -q "shellcrash-concord" /tmp/chkw.sh || { echo "web_get_bin patch missing"; exit 1; }
          # 包里不该有任何 sing-box 的东西——上游 base 带来的也得在打包时删掉。
          if tar -tzf ShellCrash.tar.gz | grep -qE "singbox|core_exchange"; then
              echo "sing-box leftovers in package:"
              tar -tzf ShellCrash.tar.gz | grep -E "singbox|core_exchange"
              exit 1
          fi
          echo "ok"

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          # 所有架构的内核 + 脚本包 + 版本号，一次传完
          ASSETS=$(ls concord-*.gz concord-*.gz.sha256 ShellCrash.tar.gz ShellCrash.tar.gz.sha256 zashboard.tar.gz version core-version | tr '\n' ' ')
          echo "上传: $ASSETS"
          ARCHLIST=$(ls concord-*.gz | sed 's/^concord-//; s/\.gz$//' | tr '\n' ' ')

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, refreshing assets"
            gh release upload "$TAG" $ASSETS --repo "$GITHUB_REPOSITORY" --clobber
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $ASSETS \
              --title "concord ${TAG#v} (ShellCrash multi-arch)" \
              --notes "从 [nikki-concord](https://github.com/user-7392/nikki-concord) \`$TAG\` 提取的 concord 内核。

          **架构**：$ARCHLIST

          - 全部静态链接，可直接在 OpenWrt（musl）上运行
          - 用法：\`sh install.sh\`（会按 \`uname -m\` 自动选架构）
          - 菜单「更新内核」也会按当前 CPU 架构自动选
          - 校验：\`sha256sum -c concord-<arch>.gz.sha256\`
          - 上游版本：${{ steps.upstream.outputs.tag }}

          `ShellCrash.tar.gz` 是 concord 专用脚本包（与内核一起每日发布），路由器菜单的「更新管理脚本」会从这里取。"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo "### concord 内核已同步"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游版本 | \`${{ steps.upstream.outputs.tag }}\` |"
            echo "| 架构 | \`${{ steps.upstream.outputs.arch }}\` |"
            echo "| 新发布 | ${{ steps.publish.outputs.created }} |"
            ls concord-*.gz.sha256 | while read -r f; do echo "| $(basename $f .sha256) | \`$(cut -d' ' -f1 $f)\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
