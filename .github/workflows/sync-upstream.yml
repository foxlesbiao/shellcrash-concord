name: sync-upstream

# 每周从 juewuy/ShellCrash 拉最新源码，应用本仓库的补丁后同步进 ShellCrash/ 目录。
# 补丁打不上（上游改了被我们改过的那几段）时，不开 PR、不静默失败，而是开 issue 报警。

on:
  schedule:
    - cron: "0 5 * * 1"   # 每周一 05:00 UTC（内核同步后 1 小时）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream ShellCrash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/juewuy/ShellCrash.git /tmp/upstream
          echo "upstream commit: $(git -C /tmp/upstream rev-parse --short HEAD)"

      - name: Apply patch (dry run)
        id: probe
        run: |
          set -euo pipefail
          cd /tmp/upstream
          if patch -p1 --batch --forward --dry-run < "$GITHUB_WORKSPACE/patches/shellcrash-concord.patch"; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch
        if: steps.probe.outputs.applied == 'true'
        run: |
          set -euo pipefail
          cd /tmp/upstream
          patch -p1 --batch --forward < "$GITHUB_WORKSPACE/patches/shellcrash-concord.patch"
          sh -n scripts/libs/core_tools.sh
          sh -n scripts/starts/clash_modify.sh
          sh -n scripts/menus/9_upgrade.sh

      - name: Sync into repo
        if: steps.probe.outputs.applied == 'true'
        run: |
          set -euo pipefail
          # scripts/ 和 tools/ 都要同步：补丁改过 tools/tg_bot.sh（内核显示名），
          # 只 rsync scripts/ 会让那处改动永远进不了仓库，下次 CI 又算一遍 diff。
          rsync -a --delete "/tmp/upstream/scripts/" "ShellCrash/scripts/"
          rsync -a --delete "/tmp/upstream/tools/" "ShellCrash/tools/"
          # 记录上游版本，便于排查
          git -C /tmp/upstream rev-parse HEAD > ShellCrash/.upstream-revision
          git -C /tmp/upstream log -1 --format='%h %s' > ShellCrash/.upstream-summary

      - name: Commit
        if: steps.probe.outputs.applied == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already up to date"
            exit 0
          fi
          git commit -m "chore: sync upstream ShellCrash $(date -u +%F) [skip ci]"
          git push

      - name: Open issue on conflict
        if: steps.probe.outputs.applied == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C /tmp/upstream log -1 --format='%H %s' > /tmp/upstream-head.txt
          HEAD=$(cat /tmp/upstream-head.txt)
          TITLE="上游 ShellCrash 补丁冲突（$(date -u +%F)）"
          # 同一标题的 issue 已开着就不重复开
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -qF "$TITLE"; then
            echo "issue already open, skipping"
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "每周同步上游时，\`patches/shellcrash-concord.patch\` 无法干净应用。

          上游 HEAD: \`$HEAD\`

          ## 需要做的
          1. \`git clone https://github.com/juewuy/ShellCrash /tmp/up\`
          2. 手动把补丁里的三处改动重新应用到新版本
          3. 重新生成补丁：
             \`\`\`
             # 在 ShellCrash/scripts 与上游对照后
             diff -u /tmp/up/scripts/libs/core_tools.sh ShellCrash/scripts/libs/core_tools.sh
             \`\`\`
          4. 提交新补丁，关闭本 issue

          ## 三处改动是什么
          - \`scripts/libs/core_tools.sh\` — \`core_check()\` 按二进制能力识别 concord
          - \`scripts/starts/clash_modify.sh\` — \`test_yaml()\` 对 concord 用 \`-t -c\`
          - \`scripts/menus/9_upgrade.sh\` — \`setcoretype()\` 菜单只留 Concord"

      - name: Summary
        run: |
          {
            echo "### 上游同步结果"
            echo ""
            if [ "${{ steps.probe.outputs.applied }}" = "true" ]; then
              echo "✅ 补丁已应用并同步"
            else
              echo "⚠️ 补丁冲突，已开 issue"
            fi
            echo ""
            echo '```'
            cat /tmp/upstream-head.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
